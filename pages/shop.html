<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop Skincare — Veloura Skin</title><meta name="description" content="Filter cleansers, serums, moisturizers, sunscreens and masks by skin type and ingredient."><link rel="icon" href="../assets/brand/favicon.svg"><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/dark-mode.css"><link rel="stylesheet" href="../assets/css/rtl.css"></head><body><main id="main">
<section class="inner-hero"><div class="container"><span class="eyebrow">The complete shelf</span><h1>Skincare, sorted your way.</h1><p class="lead">Filter by skin type, category or highlighted ingredient. Product concepts are easy to customize from one central dataset.</p></div></section>
<section class="section"><div class="container shop-layout"><aside class="filters" aria-label="Product filters"><div style="display:flex;justify-content:space-between"><h2 style="font-size:1.3rem">Filters</h2><button class="icon-btn" id="closeFilters" aria-label="Close filters">✕</button></div><form id="filters"><div class="filter-group"><h3>Category</h3><label class="check-row"><input type="radio" name="category" value="All" checked> All Products</label><label class="check-row"><input type="radio" name="category" value="Cleansers"> Cleansers</label><label class="check-row"><input type="radio" name="category" value="Serums"> Serums</label><label class="check-row"><input type="radio" name="category" value="Moisturizers"> Moisturizers</label><label class="check-row"><input type="radio" name="category" value="Sunscreens"> Sunscreens</label><label class="check-row"><input type="radio" name="category" value="Masks"> Masks</label></div><div class="filter-group"><h3>Skin type</h3><label class="check-row"><input type="radio" name="skin" value="All" checked> All</label><label class="check-row"><input type="radio" name="skin" value="Dry"> Dry</label><label class="check-row"><input type="radio" name="skin" value="Oily"> Oily</label><label class="check-row"><input type="radio" name="skin" value="Combination"> Combination</label><label class="check-row"><input type="radio" name="skin" value="Normal"> Normal</label><label class="check-row"><input type="radio" name="skin" value="Sensitive"> Sensitive</label></div><div class="filter-group"><h3>Ingredient</h3><select class="select" name="ingredient" style="width:100%"><option>All</option><option>Glycerin</option><option>Hyaluronic Acid</option><option>Niacinamide</option><option>Ceramides</option><option>Salicylic Acid</option><option>Vitamin C</option><option>Azelaic Acid</option><option>Squalane</option><option>Zinc Oxide</option><option>Panthenol</option></select></div><div class="filter-group"><h3>Maximum price: <span id="priceValue">₹2,500</span></h3><input name="price" type="range" min="1000" max="2500" step="50" value="2500" style="width:100%"></div><div class="filter-group"><label class="check-row"><input type="checkbox" name="available"> Available now</label></div></form><button class="btn btn-outline" id="clearFilters" style="width:100%;margin-top:16px">Clear all</button></aside><div><div class="catalog-bar"><div><button class="btn btn-outline filter-toggle">Filters</button> <strong id="resultCount" aria-live="polite"></strong></div><label>Sort <select id="sortProducts" class="select"><option value="featured">Featured</option><option value="newest">Newest</option><option value="price-low">Price Low to High</option><option value="price-high">Price High to Low</option><option value="name">Name A–Z</option></select></label></div><div class="product-grid" id="catalogGrid"></div></div></div></section></main>
<script src="../assets/js/products.js"></script><script src="../assets/js/cart.js"></script><script src="../assets/js/main.js"></script><script src="../assets/js/shop.js"></script></body></html>
