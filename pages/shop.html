<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Shop Skincare — Veloura Skin</title><meta name="description" content="Filter Veloura cleansers, serums, moisturizers, sunscreen and masks by skin type and ingredient.">
  <link rel="icon" href="../assets/brand/favicon.svg"><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/dark-mode.css"><link rel="stylesheet" href="../assets/css/rtl.css">
</head>
<body>
<main id="main">
  <header class="shop-head"><div class="container"><div class="shop-head-row"><div><span class="eyebrow">The complete shelf</span><h1>Shop skincare</h1></div><p>Focused formulas, filtered around your routine.</p></div><div class="shop-categories" aria-label="Product categories"><button class="category-pill active" type="button" data-category-pill="All">All</button><button class="category-pill" type="button" data-category-pill="Cleansers">Cleansers</button><button class="category-pill" type="button" data-category-pill="Serums">Serums</button><button class="category-pill" type="button" data-category-pill="Moisturizers">Moisturizers</button><button class="category-pill" type="button" data-category-pill="Sunscreens">Sunscreens</button><button class="category-pill" type="button" data-category-pill="Masks">Masks</button></div></div></header>
  <section class="section"><div class="container shop-layout">
    <aside class="filters" id="filterDrawer" aria-label="Product filters" aria-hidden="false">
      <div class="filter-head"><h2>Filter products</h2><button class="icon-btn" id="closeFilters" type="button" aria-label="Close filters">✕</button></div>
      <form id="filters">
        <div class="filter-group"><h3>Category</h3><label class="check-row"><input type="radio" name="category" value="All" checked> All products</label><label class="check-row"><input type="radio" name="category" value="Cleansers"> Cleansers</label><label class="check-row"><input type="radio" name="category" value="Serums"> Serums</label><label class="check-row"><input type="radio" name="category" value="Moisturizers"> Moisturizers</label><label class="check-row"><input type="radio" name="category" value="Sunscreens"> Sunscreens</label><label class="check-row"><input type="radio" name="category" value="Masks"> Masks</label></div>
        <div class="filter-group"><h3>Skin type</h3><label class="check-row"><input type="radio" name="skin" value="All" checked> All skin types</label><label class="check-row"><input type="radio" name="skin" value="Dry"> Dry</label><label class="check-row"><input type="radio" name="skin" value="Oily"> Oily</label><label class="check-row"><input type="radio" name="skin" value="Combination"> Combination</label><label class="check-row"><input type="radio" name="skin" value="Normal"> Normal</label><label class="check-row"><input type="radio" name="skin" value="Sensitive"> Sensitive</label></div>
        <div class="filter-group"><label for="ingredientFilter"><h3>Highlighted ingredient</h3></label><select class="select" name="ingredient" id="ingredientFilter"><option>All</option><option>Glycerin</option><option>Hyaluronic Acid</option><option>Niacinamide</option><option>Ceramides</option><option>Salicylic Acid</option><option>Vitamin C</option><option>Azelaic Acid</option><option>Squalane</option><option>Zinc Oxide</option><option>Panthenol</option></select></div>
        <div class="filter-group"><label for="priceFilter"><h3>Maximum price: <span id="priceValue">₹2,500</span></h3></label><input name="price" id="priceFilter" type="range" min="1000" max="2500" step="50" value="2500"></div>
        <div class="filter-group"><label class="check-row"><input type="checkbox" name="available"> Available now</label></div>
      </form>
      <div class="filter-actions"><button class="btn btn-outline" id="clearFilters" type="button">Clear</button><button class="btn btn-primary" id="applyFilters" type="button">Apply filters</button></div>
      <button class="btn btn-text" id="desktopClearFilters" type="button">Clear all filters</button>
    </aside>
    <div><div class="catalog-bar"><div><button class="btn btn-outline filter-toggle" type="button" aria-controls="filterDrawer" aria-expanded="false">Filters</button><strong id="resultCount" aria-live="polite"></strong></div><label for="sortProducts">Sort <select id="sortProducts" class="select"><option value="featured">Featured</option><option value="newest">Newest</option><option value="price-low">Price: low to high</option><option value="price-high">Price: high to low</option><option value="name">Name A–Z</option></select></label></div><div class="product-grid" id="catalogGrid"></div></div>
  </div></section>
</main>
<script src="../assets/js/products.js"></script><script src="../assets/js/cart.js"></script><script src="../assets/js/main.js"></script><script src="../assets/js/shop.js"></script>
</body>
</html>
