<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — Arenne Skin</title><meta name="description" content="Review delivery details in this checkout availability and delivery details."><link rel="icon" href="../assets/brand/favicon.svg"><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/dark-mode.css"><link rel="stylesheet" href="../assets/css/rtl.css"><script src="../assets/js/theme-init.js"></script></head><body><main id="main"><section class="inner-hero"><div class="container"><span class="eyebrow">Checkout status</span><h1>Review your delivery details.</h1><p>No payment processor is connected. Do not enter card numbers, CVVs, UPI PINs or real payment credentials.</p></div></section><section class="section"><div class="container checkout-layout"><form class="info-card" data-validate novalidate><h2>Contact & delivery</h2><div class="form-grid"><div class="field"><label for="checkoutEmail">Email *</label><input class="form-control" id="checkoutEmail" type="email" required placeholder="you@example.com"><div class="field-error"></div></div><div class="field"><label for="checkoutPhone">Phone *</label><input class="form-control" id="checkoutPhone" type="tel" required placeholder="Delivery contact"><div class="field-error"></div></div><div class="field full"><label for="checkoutName">Full name *</label><input class="form-control" id="checkoutName" required autocomplete="name"><div class="field-error"></div></div><div class="field full"><label for="checkoutAddress">Delivery address *</label><textarea class="form-control" id="checkoutAddress" required placeholder="Address, city, postal code"></textarea><div class="field-error"></div></div><div class="field full"><label for="shipping">Shipping method</label><select class="form-control" id="shipping"><option>Standard — configure rate</option><option>Express — configure rate</option></select></div></div><button class="btn btn-primary" type="submit">Review details</button><div class="form-status" hidden></div></form><aside class="summary-card"><h2 style="font-size:1.4rem">Order summary</h2><div id="checkoutSummary"></div><p class="notice">This form does not place an order or collect payment.</p></aside></div></section></main><script src="../assets/js/products.js"></script><script src="../assets/js/cart.js"></script><script src="../assets/js/main.js"></script><script src="../assets/js/forms.js"></script><script src="../assets/js/checkout.js"></script></body></html>
